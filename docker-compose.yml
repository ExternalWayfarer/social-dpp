
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173" # port for Vite
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app-frontend # mount project in container
      - /app-frontend/node_modules # no node_modules


  backend:
    build:
      context: ./mysite
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # for django
    environment:
      DATABASE_URL: "postgresql://father:1234@db:5432/motherbase"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mysite:/app-backend 

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: father
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: motherbase
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data # datdabase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U father -d motherbase"] # if ready
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data: