{% extends 'miniblog/base.html' %}

{% block content %}
{% for post in posts %}

<div class="post">

    <h1><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h1>
    <p>{{ post.body|linebreaksbr }}</p>
    <div class="date">
        <p>Опубликовано: {{ post.published_date }} пользователем {{ post.author }}</p>
    </div>
</div>
{% endfor %}
{% endblock %}
